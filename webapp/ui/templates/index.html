{% load static %}
<link rel="stylesheet" type="text/css" href="{% static 'ui.css' %}"/>
<link rel="shortcut icon" type="image/x-icon" href="{% static 'favicon.ico' %}" />
<!-- other browsers -->
<link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}" />
<button id="theme-toggle" onclick="toggleTheme()">dark</button>
<script>
function toggleTheme() {
    const isDark = document.body.classList.toggle('dark-mode');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    document.getElementById('theme-toggle').textContent = isDark ? 'light' : 'dark';
}
(function() {
    const saved = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (saved === 'dark' || (!saved && prefersDark)) {
        document.body.classList.add('dark-mode');
        document.getElementById('theme-toggle').textContent = 'light';
    }
})();
</script>
<div id="spacer" style="padding-top: 25px;"></div>
<div id="search-main">
    botanist code search<br><br>

    <form action="/search/" method="get">
        <input id="search-box" type="text" name="q" size="70px" autofocus>
        <br>
        <br>
        <input type="hidden" name="case" value="sensitive">

        <div id="search-box-display" class="regex"></div>
        <label for="case-insensitive-input">ignore case</label>
        <input id="case-insensitive-input" name="case" type="checkbox"
               value="insensitive">
        <input type="submit" value="submit">
    </form>
</div>
<div id="search-help">
    note: searches are <a href="https://github.com/google/re2/wiki/Syntax">RE2
    (nearly PCRE) regular expressions</a>
</div>
